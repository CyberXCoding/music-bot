services:
  - type: web
    name: ANNIE-X-MUSIC
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c "python -m ANNIEMUSIC & python web_server.py"
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: LOGGER_ID
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: DEEP_API
        sync: false
      - key: GPT_API
        sync: false
      - key: PORT
        value: "10000"
